name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: temurin
      - uses: gradle/actions/setup-gradle@v6.3.0
      - name: Build and test ORM and Quarkus
        working-directory: project
        run: ./gradlew build --build-cache
      - name: Publish and verify isolated consumer
        run: |
          project/gradlew -p project publishToMavenLocal -Dmaven.repo.local="$RUNNER_TEMP/jimmer-m2"
          version=$(sed -n 's/^version=//p' project/gradle.properties)
          python3 scripts/verify-publication.py "$RUNNER_TEMP/jimmer-m2" "$version"
          project/gradlew -p smoke-tests build -PforkRepository="file://$RUNNER_TEMP/jimmer-m2" -PforkVersion="$version"
