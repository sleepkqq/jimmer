name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_DB: jimmer_test
          POSTGRES_USER: root
          POSTGRES_PASSWORD: '123456'
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U root -d jimmer_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: temurin
      - uses: gradle/actions/setup-gradle@v6.3.0
      - name: Build and test ORM and Quarkus
        working-directory: project
        run: ./gradlew build --build-cache
      - name: Verify reference update-returning on PostgreSQL
        env:
          jimmer-sql-test-native-database: postgres
        run: |
          docker exec -i "${{ job.services.postgres.id }}" psql -U root -d jimmer_test -v ON_ERROR_STOP=1 < project/jimmer-sql/src/test/resources/database-postgres.sql
          # Ubuntu's /bin/sh drops the upstream fixture's hyphenated environment key.
          bash project/gradlew -p project :jimmer-sql:test --tests '*FluentDMLTest.testUpdateReturningReferenceIdByPostgres'
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          result = ET.parse('project/jimmer-sql/build/test-results/test/TEST-org.babyfish.jimmer.sql.mutation.FluentDMLTest.xml').getroot()
          print({key: result.get(key) for key in ('tests', 'failures', 'errors', 'skipped')})
          assert result.get('tests') == '1'
          assert all(result.get(key) == '0' for key in ('failures', 'errors', 'skipped'))
          print('PostgreSQL reference update-returning: passed, no skipped cases')
          PY
      - name: Publish and verify isolated consumer
        run: |
          project/gradlew -p project publishToMavenLocal -Dmaven.repo.local="$RUNNER_TEMP/jimmer-m2"
          version=$(sed -n 's/^version=//p' project/gradle.properties)
          python3 scripts/verify-publication.py "$RUNNER_TEMP/jimmer-m2" "$version"
          project/gradlew -p smoke-tests build -PforkRepository="file://$RUNNER_TEMP/jimmer-m2" -PforkVersion="$version"
