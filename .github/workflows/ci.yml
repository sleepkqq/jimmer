name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      publicReleaseVersion:
        description: 'Released fork version to verify anonymously from JitPack (empty skips public verification)'
        required: false
        default: ''
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_DB: jimmer_test
          POSTGRES_USER: root
          POSTGRES_PASSWORD: '123456'
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U root -d jimmer_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: temurin
      - uses: gradle/actions/setup-gradle@v6.3.0
      - name: Start the canonical MySQL fixture
        run: docker compose -f project/jimmer-sql/src/test/resources/docker-compose.yml up -d --wait --wait-timeout 120 mysql
      - name: Load the canonical PostgreSQL fixture
        run: docker exec -i "${{ job.services.postgres.id }}" psql -U root -d jimmer_test -v ON_ERROR_STOP=1 < project/jimmer-sql/src/test/resources/database-postgres.sql
      - name: Build and test ORM, processors, Kotlin and Quarkus
        working-directory: project
        env:
          jimmer-sql-test-native-database: postgres
        # Bash preserves the upstream fixture's hyphenated environment key.
        run: bash ./gradlew --no-build-cache --no-parallel --max-workers=2 build
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: build-test-reports
          path: |
            project/**/build/test-results/**
            project/**/build/reports/tests/**
          if-no-files-found: warn

  publish-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: temurin
      - uses: gradle/actions/setup-gradle@v6.3.0
      - name: Publish every fork module to an isolated repository
        run: project/gradlew -p project --no-parallel --max-workers=2 publishToMavenLocal -Dmaven.repo.local="$RUNNER_TEMP/jimmer-m2"
      - name: Verify every published artifact and shared version
        run: |
          version=$(sed -n 's/^version=//p' project/gradle.properties)
          python3 scripts/verify-publication.py "$RUNNER_TEMP/jimmer-m2" "$version"
      - name: Build the isolated consumer against only the published fork
        run: |
          version=$(sed -n 's/^version=//p' project/gradle.properties)
          project/gradlew -p smoke-tests --no-parallel --max-workers=2 build -PforkRepository="file://$RUNNER_TEMP/jimmer-m2" -PforkVersion="$version"
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: isolated-consumer-test-reports
          path: |
            smoke-tests/build/test-results/test
            smoke-tests/build/reports/tests/test
          if-no-files-found: warn

  public-release-verify:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.publicReleaseVersion != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: temurin
      - uses: gradle/actions/setup-gradle@v6.3.0
      - name: Require the dispatched version to match this ref
        env:
          PUBLIC_RELEASE_VERSION: ${{ github.event.inputs.publicReleaseVersion }}
        run: |
          configured=$(sed -n 's/^version=//p' project/gradle.properties)
          if [ "$PUBLIC_RELEASE_VERSION" != "$configured" ]; then
            echo "::error::requested $PUBLIC_RELEASE_VERSION does not match project/gradle.properties $configured at ${GITHUB_REF}"
            exit 1
          fi
      - name: Verify the anonymous JitPack release
        env:
          PUBLIC_RELEASE_VERSION: ${{ github.event.inputs.publicReleaseVersion }}
        run: python3 scripts/verify-publication.py https://jitpack.io "$PUBLIC_RELEASE_VERSION"
      - name: Build the isolated consumer against the public release
        env:
          PUBLIC_RELEASE_VERSION: ${{ github.event.inputs.publicReleaseVersion }}
        run: project/gradlew -p smoke-tests clean build -PforkVersion="$PUBLIC_RELEASE_VERSION" --no-parallel --max-workers=2 --refresh-dependencies
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: public-release-test-reports
          path: |
            smoke-tests/build/test-results/test
            smoke-tests/build/reports/tests/test
          if-no-files-found: warn
